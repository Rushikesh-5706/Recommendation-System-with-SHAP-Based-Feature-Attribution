version: '3.8'

services:
  recsys:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: explainable-recsys
    env_file:
      - .env.example
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, os; sys.exit(0 if os.path.exists('/app/src/prepare_data.py') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
